name: Deploy DailyInfo Web to GitHub Pages

# Runs: push to main, daily cron (23:00 UTC = 07:00 Asia/Shanghai), manual dispatch.
# The local Windows task (DailyInfoUpdate, 07:10) also dispatches this workflow as a
# reliable backstop — GitHub cron on free accounts can be delayed or dropped.
on:
  push:
    branches: [main]
  schedule:
    # Upstream publishes categories in WAVES through the morning Beijing time
    # (ai_news early, then arxiv/code/papers/resource), so one snapshot at
    # 07:00 only ever captures the first wave. Three crons follow the waves:
    #   23:00 UTC = 07:00 +08:00, 00:30 UTC = 08:30, 02:00 UTC = 10:00
    # Cached runs cost ~0 API calls; each deploys whatever is new.
    - cron: '0 23 * * *'
    - cron: '30 0 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep the production deployment explicit. The origin is owner-aware so the
# same workflow deploys correctly on the upstream repo and on forks. A future
# custom-domain migration changes SITE_ORIGIN to https://daily.iheadwater.org
# and SITE_BASE to /.
env:
  SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
  SITE_BASE: /dailyinfo-web

concurrency:
  group: pages
  # Queue instead of cancel: a second wave-catch-up run waiting behind a
  # still-running translation is cheaper than discarding its work.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync content from upstream (iHeadWater)
        run: |
          git remote add upstream https://github.com/iHeadWater/dailyinfo-web.git || true
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main || git merge --abort || true
        continue-on-error: true

      # English edition: restore previous translations, translate only the
      # newest day(s). Free-tier friendly: fully cached runs cost 0 API calls.
      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: runtime/bot-cache
          key: bot-cache-${{ github.run_id }}
          restore-keys: bot-cache-

      - name: Translate new briefings into English
        run: npm run bot -- update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true

      - name: Content validation
        run: npm run validate

      - name: Contract regression tests
        run: npm run test

      - name: Astro / TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
